<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Studio</title>
<link rel="icon" href="data:,">
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js" } }</script>
<style>
  :root { --ink: #e8f1f4; --dim: #8fa3ad; --line: rgba(255,255,255,.12); --panel: rgba(8,12,18,.78); --acc: #7fe3d6; --tb: 104px; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
  canvas { display: block; position: fixed; }
  #stage { position: fixed; left: 0; top: 0; right: 0; bottom: var(--tb); }
  #stage.checker { background: repeating-conic-gradient(#2a2d31 0 25%, #1c1e21 0 50%) 0 0 / 22px 22px; }
  .panel { position: fixed; top: 14px; width: 250px; max-height: calc(100% - var(--tb) - 28px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(10px); z-index: 2; box-sizing: border-box; }
  #panel { right: 14px; width: 270px; } #shots { left: 14px; width: 270px; }
  body.hide .panel { display: none; }
  h1 { font-size: 11px; letter-spacing: .18em; margin: 0 0 10px; color: var(--dim); font-weight: 600; }
  .sec { margin: 12px 0 4px; font-size: 10px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .row > label { flex: 0 0 74px; color: var(--dim); }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--acc); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button, .btn, .mini { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; cursor: pointer; font: inherit; }
  .seg button.on, .btn.on { background: var(--acc); color: #001; border-color: var(--acc); }
  .btn { width: 100%; margin-top: 6px; } .btn:disabled { opacity: .45; cursor: default; }
  .mini { padding: 2px 6px; border-radius: 5px; font-size: 11px; }
  select, input[type=number], textarea { background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; padding: 3px 5px; }
  select { flex: 1; min-width: 0; } input[type=number] { width: 58px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 52px; resize: vertical; font-size: 14px; }
  input[type=color] { width: 34px; height: 22px; border: 0; background: none; padding: 0; }
  .val { flex: 0 0 30px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .shot { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px; margin: 4px 0; cursor: pointer; }
  .shot.on { border-color: var(--acc); background: rgba(127,227,214,.08); }
  .shot b { flex: 0 0 16px; color: var(--acc); } .shot span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .shot em { color: var(--dim); font-style: normal; font-variant-numeric: tabular-nums; }
  .note { color: var(--dim); font-size: 11px; margin-top: 4px; word-break: break-word; }
  code { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfe; background: rgba(255,255,255,.06); padding: 4px 6px; border-radius: 5px; display: block; margin-top: 4px; user-select: all; }
  .group { border-left: 2px solid var(--line); padding-left: 8px; margin: 6px 0; }
  #transport { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tb); background: rgba(6,9,14,.92); border-top: 1px solid var(--line); z-index: 3; padding: 8px 14px; box-sizing: border-box; }
  #tline1 { display: flex; align-items: center; gap: 10px; }
  #play { width: 34px; height: 30px; font-size: 14px; }
  #scrub { flex: 1; accent-color: var(--acc); }
  #time { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: var(--dim); min-width: 170px; text-align: right; }
  #strip { position: relative; display: flex; height: 30px; margin-top: 8px; margin-left: 44px; margin-right: 180px; gap: 2px; }
  #strip div.cell { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; padding: 3px 6px; box-sizing: border-box; white-space: nowrap; text-overflow: ellipsis; color: var(--dim); }
  #strip div.cell.on { border-color: var(--acc); color: var(--ink); }
  #strip div.cell i { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(127,227,214,.14); pointer-events: none; }
  #strip div.cell u { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(255,140,90,.14); pointer-events: none; text-decoration: none; }
  #head { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; pointer-events: none; box-shadow: 0 0 6px #fff; }
  #status { position: absolute; left: 58px; bottom: 6px; color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; right: 260px; text-overflow: ellipsis; }
  #status.err { color: #ff8f7a; }
  #drop { position: fixed; inset: 0; border: 3px dashed var(--acc); background: rgba(0,20,20,.45); z-index: 9; display: none; align-items: center; justify-content: center; font-size: 18px; letter-spacing: .1em; }
  body.dragging #drop { display: flex; }
  #hint { position: absolute; right: 14px; bottom: 6px; color: var(--dim); font-size: 11px; pointer-events: none; }
  @media (max-width: 760px) { #shots { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="c"></canvas>

<!-- left: the timeline as a list + the selected shot -->
<div class="panel" id="shots">
  <h1>SHOTS</h1>
  <div id="shotList"></div>
  <div class="row"><button class="btn" id="addShot" style="margin-top:2px">+ Add shot</button></div>
  <div id="shotEd"></div>
</div>

<!-- right: the look (v1 controls) + exports -->
<div class="panel" id="panel">
  <h1>LINE STUDIO</h1>
  <div class="sec">Colour</div>
  <div class="seg" id="preset">
    <button data-v="white">White</button><button data-v="ember">Teal Fire</button><button data-v="rose">Lilac Rose</button><button data-v="gold">Gold</button>
    <button data-v="neon">Neon</button><button data-v="ice">Ice</button><button data-v="claude">Claude</button>
  </div>
  <div class="seg" id="mode" style="margin-top:6px" title="colour mode"><button data-v="0">Mono</button><button data-v="1">Gradient</button><button data-v="2">By light</button></div>
  <div class="row"><label>Colours</label><input type="color" id="colA"><input type="color" id="colB"></div>
  <div class="sec">Lines</div>
  <div class="row"><label>Width</label><input type="range" id="width" min="0.3" max="3" step="0.05"></div>
  <div class="row"><label>Brightness</label><input type="range" id="gain" min="0.3" max="3" step="0.05"></div>
  <div class="row"><label>Contrast</label><input type="range" id="gamma" min="0.4" max="2.5" step="0.05"></div>
  <div class="row"><label>Glow</label><input type="range" id="glow" min="0" max="2.5" step="0.05"></div>
  <div class="row"><label>Particles</label><input type="range" id="dots" min="0" max="2" step="0.05"></div>
  <div class="sec">Motion</div>
  <div class="row"><label>Pulses</label><input type="range" id="pulse" min="0" max="2" step="0.05"></div>
  <div class="row"><label>Pulse speed</label><input type="range" id="pulseSpeed" min="0.1" max="3" step="0.05"></div>
  <div class="row"><label>Breathe</label><input type="range" id="breathe" min="0" max="1" step="0.05"></div>
  <div class="sec">Effects (mix any)</div>
  <div class="seg" id="fx"><button data-v="shimmer">Shimmer</button><button data-v="scan">Scan</button><button data-v="ripple">Ripple</button><button data-v="heartbeat">Heartbeat</button><button data-v="glitch">Glitch</button><button data-v="wind">Wind</button><button data-v="dash">Dash flow</button><button data-v="flicker">Neon flicker</button><button data-v="aurora">Aurora</button><button data-v="sweep">Light sweep</button></div>
  <div class="row"><label>Strength</label><input type="range" id="fxAmount" min="0" max="2" step="0.05"></div>
  <div class="row"><label>FX speed</label><input type="range" id="fxSpeed" min="0.2" max="3" step="0.05"></div>
  <div class="sec">Background</div>
  <div class="row"><label>Colour</label><input type="color" id="bg"><button class="mini" id="transparent" title="preview and PNG with alpha (checkerboard)">Transparent</button></div>
  <div class="row"><label>BG lines</label><input type="range" id="backdrop" min="0" max="2.5" step="0.05"></div>
  <div class="row"><label>Wave motion</label><input type="range" id="wave" min="0" max="3" step="0.05"></div>
  <div class="sec">Frame</div>
  <div class="seg" id="frame"><button data-v="9:16">9:16</button><button data-v="4:5">4:5</button><button data-v="1:1">1:1</button><button data-v="16:9">16:9</button></div>
  <div class="row"><label>Line budget</label><input type="range" id="strokes" min="2000" max="16000" step="500"><span class="val" id="strokesV"></span></div>
  <div class="row"><label>Particle count</label><input type="range" id="dotCount" min="0" max="12000" step="500"><span class="val" id="dotCountV"></span></div>
  <button class="btn" id="replay">Replay</button>
  <button class="btn" id="save">Save PNG (current frame)</button>
  <div class="sec">Video</div>
  <div class="row"><label>Seconds</label><span id="vlen" style="color:var(--dim)"></span></div>
  <div class="row"><label>Size</label><div class="seg" id="vscale"><button data-v="1">Full</button><button data-v="0.5">Half</button></div></div>
  <button class="btn" id="mp4">Download MP4 (H.264)</button>
  <button class="btn" id="webm">Download WebM (transparent)</button>
  <div id="recstat" class="note" style="min-height:16px"></div>
  <div class="sec">Scene</div>
  <div class="row" style="gap:6px"><button class="btn" id="copyJson" style="margin:0">Copy scene.json</button><button class="btn" id="dlJson" style="margin:0">Download</button></div>
  <div class="note">Save it in <b>claude-line-portrait-v2/studio/</b> (data/, assets/, fonts/ resolve from there), then:</div>
  <code id="cmd"></code>
</div>

<div id="transport">
  <div id="tline1"><button class="mini" id="play" title="Space">▶</button><input type="range" id="scrub" min="0" max="1" step="1" value="0"><span id="time"></span></div>
  <div id="strip"><div id="head"></div></div>
  <div id="status"></div>
  <div id="hint">H = hide panels · Space = play · ←/→ = frame</div>
</div>
<div id="drop">Drop SVG / PNG / font / scene.json</div>
<input type="file" id="fileIn" style="display:none">

<script type="module">
// Line Studio: builds a scene spec (engine/scene.mjs) from the panels, previews it with the LineField engine and exports
// it frame-exactly. Shapes are traced once here and handed to the engine as {shape}, so a re-load only re-samples.
import { createEngine } from './engine/linefield.mjs';
import { normalize, PRESETS, LOOK_DEFAULT, FX } from './engine/scene.mjs';
import { EASE_ID } from './engine/ease.mjs';
import { loadBaked, svgToShape, bitmapToShape, textToShape } from './engine/shapes.mjs';

const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const FRAMES = { '9:16': [1080, 1920, 9, 16], '4:5': [1080, 1350, 4, 5], '1:1': [1080, 1080, 1, 1], '16:9': [1920, 1080, 16, 9] };
const FONTS = { plex: 'fonts/IBMPlexSansArabic-Bold.ttf', inter: 'fonts/Inter-Variable.ttf' };
const SAMPLES = ['heart', 'spark', 'bolt'];
const IN_LIST = ['none', 'fade', 'draw', 'assemble', 'wipe', 'glitch', 'sweep', 'sting', 'morph'];
const OUT_LIST = ['none', 'fade', 'draw', 'undraw', 'disperse', 'wipe', 'glitch', 'sweep'];
const STYLES = ['explode', 'dust', 'wind', 'vortex'], DIRS = ['ltr', 'rtl', 'ttb', 'btt', 'diag'];
const ORDERS = ['auto', 'ttb', 'ltr', 'rtl', 'center', 'random', 'path', 'btt', 'outside'];
const EASES = Object.keys(EASE_ID);
const LETTER = (k) => String.fromCharCode(65 + (k % 26)) + (k >= 26 ? Math.floor(k / 26) : '');
const status = (msg, err = false) => { $('status').textContent = msg; $('status').classList.toggle('err', err); };

// transition defaults come straight from scene.mjs (normalize a dummy two-shot scene), so the panel never drifts from the engine
function trDefaults(kind, type) {
  const shots = [{ input: { text: 'x' }, duration: 1e3 }, { input: { text: 'x' }, duration: 1e3, [kind]: { type } }];
  const t = normalize({ shots }).shots[1][kind]; return { type, dur: t.dur ?? 0, ease: t.ease || 'outCubic', style: t.style, dir: t.dir, order: 'auto' };
}

// ---------------------------------------------------------------- camera moves (per shot, scaled by Strength)
// frame = 1 unit tall: pan 0.06 = 6% of the frame; yaw/pitch/roll in degrees; every move runs over the whole shot
const CAMS = {
  static:    { label: 'Static',        f: () => ({}) },
  push:      { label: 'Push in',       f: (a) => ({ zoom: [1, 1 + 0.3 * a] }) },
  pull:      { label: 'Pull out',      f: (a) => ({ zoom: [1 + 0.35 * a, 1] }) },
  face:      { label: 'Face push',     f: (a) => ({ zoom: [1, 1 + 0.7 * a], pan: [[0, 0], [0, 0.13 * a]], ease: 'inOutCubic' }) },
  crash:     { label: 'Crash zoom',    f: (a) => ({ zoom: [1 - 0.2 * a, 1 + 0.35 * a], ease: 'outExpo' }) },
  pan:       { label: 'Pan →',         f: (a) => ({ pan: [[-0.1 * a, 0], [0.1 * a, 0]], zoom: 1 + 0.22 * a }) },
  tilt:      { label: 'Tilt up',       f: (a) => ({ pan: [[0, -0.1 * a], [0, 0.1 * a]], zoom: 1 + 0.22 * a }) },
  orbit:     { label: 'Orbit',         f: (a) => ({ yaw: [-24 * a, 24 * a], zoom: 1 + 0.06 * a }) },
  dutch:     { label: 'Dutch roll',    f: (a) => ({ roll: [-7 * a, 7 * a], zoom: [1 + 0.08 * a, 1 + 0.2 * a] }) },
  reveal:    { label: 'Rise reveal',   f: (a) => ({ zoom: [1 + 0.6 * a, 1], pitch: [22 * a, 0], ease: 'outCubic' }) },
  float:     { label: 'Float',         f: (a) => ({ yaw: [-10 * a, 10 * a], pitch: [6 * a, -6 * a], zoom: [1 + 0.04 * a, 1 + 0.14 * a] }) },
};

// ---------------------------------------------------------------- the document
let uid = 1;
const newShot = (o) => ({ id: uid++, kind: 'text', portrait: 'boy', svgSample: 'heart', svgFile: null, png: null, trace: 'auto', text: 'Hello', font: 'plex', fontFile: null,
  duration: 3, fit: 0.8, cam: 'static', camAmt: 1, in: trDefaults('in', 'draw'), out: trDefaults('out', 'none'), preset: '', ...o });
const presetName = PRESETS[Q.get('preset')] ? Q.get('preset') : 'ember';
const fxQ = (Q.get('fx') || '').split(',').filter(Boolean).map((v) => (/^\d+$/.test(v) ? FX[+v] : v)).filter((v) => FX.includes(v));
const D = {
  frame: FRAMES[Q.get('frame')] ? Q.get('frame') : '9:16', fps: 30, transparent: Q.get('transparent') === '1', strokes: 9000, dotCount: 6000, backdrop: 0.6, wave: 1,
  look: { ...LOOK_DEFAULT, ...PRESETS[presetName], preset: presetName }, bg: PRESETS[presetName].bg, fx: fxQ, fxAmount: 1, fxSpeed: 1,
  shots: [   // the demo: logo sting → morph to Arabic text → morph to a portrait
    newShot({ kind: 'svg', svgSample: 'spark', duration: 2.6, fit: 0.55, in: trDefaults('in', 'sting') }),
    newShot({ kind: 'text', text: 'خطوط من نور', duration: 2.8, fit: 0.85, in: trDefaults('in', 'morph') }),
    newShot({ kind: 'portrait', portrait: /^[\w-]+$/.test(Q.get('d') || '') ? Q.get('d') : 'boy', duration: 4, fit: 0.92, in: { ...trDefaults('in', 'morph'), dur: 1.6 } }),
  ],
};
let sel = 0;

/** engine input for a shot (blob URLs for the page, data URLs for scene.json); null if the shot has nothing to show yet */
function inputOf(s, forJson) {
  if (s.kind === 'portrait') return { baked: `data/${s.portrait}` };
  if (s.kind === 'svg') return s.svgFile ? { svg: s.svgFile.text } : { svg: `assets/${s.svgSample}.svg` };
  if (s.kind === 'png') return s.png ? { png: forJson ? s.png.dataUrl : s.png.url, trace: s.trace || 'auto' } : null;
  if (s.kind === 'text') { if (!s.text.trim()) return null;
    const font = s.font === 'custom' && s.fontFile ? (forJson ? s.fontFile.dataUrl : s.fontFile.url) : FONTS[s.font] || FONTS.plex;
    return { text: s.text, font }; }
  return null;
}
const trSpec = (t, kind, k, shot) => {
  if (!t || t.type === 'none') return undefined;
  const o = { type: t.type, dur: +t.dur, ease: t.ease };
  if (['assemble', 'sting', 'disperse'].includes(t.type)) o.style = t.style || (kind === 'in' ? 'explode' : 'dust');
  if (['wipe', 'sweep'].includes(t.type)) o.dir = t.dir || (t.type === 'sweep' ? 'diag' : 'ltr');
  if (t.order && t.order !== 'auto') o.order = t.order;
  return o;
};
/** doc → scene spec. Fixes what the engine would reject (too-long transitions, a morph into shot A) and reports it. */
function buildSpec({ forJson = false, alpha = false } = {}) {
  const [w, h] = FRAMES[D.frame], warn = [];
  const fx = D.fx.slice();
  const shots = D.shots.map((s, k) => {
    const input = inputOf(s, forJson); if (!input) throw new Error(`shot ${LETTER(k)}: ${s.kind === 'png' ? 'open or drop an image' : 'type some text'}`);
    let tin = trSpec(s.in, 'in', k, s), tout = trSpec(s.out, 'out', k, s);
    if (tin?.type === 'morph' && k === 0) { tin = { type: 'fade', dur: 0.6, ease: 'outCubic' }; warn.push('shot A cannot morph (fade used)'); }
    if (D.shots[k + 1]?.in.type === 'morph') tout = undefined;   // the next shot's morph takes this shape whole
    const din = tin?.dur || 0, dout = tout?.dur || 0;
    if (din + dout > s.duration) { const f = s.duration / (din + dout); if (tin) tin.dur = +(din * f).toFixed(3); if (tout) tout.dur = +(dout * f - 1e-3).toFixed(3); warn.push(`shot ${LETTER(k)}: transitions shortened to fit`); }
    const o = { input, duration: +s.duration, fit: +s.fit, fx, fxAmount: D.fxAmount, fxSpeed: D.fxSpeed };
    if (tin) o.in = tin; if (tout) o.out = tout; if (s.preset) o.look = { preset: s.preset };
    if (s.cam && s.cam !== 'static' && CAMS[s.cam]) o.camera = CAMS[s.cam].f(+s.camAmt || 1);
    return o;
  });
  const look = { ...D.look }; delete look.bg;
  const spec = { width: w, height: h, fps: D.fps, background: alpha || D.transparent ? 'transparent' : D.bg, strokes: D.strokes, points: 8, dots: D.dotCount,
    backdrop: D.backdrop, wave: D.wave, look, shots };
  return { spec, warn };
}

// ---------------------------------------------------------------- engine
const canvas = $('c');
const eng = await createEngine({ canvas, width: 1080, height: 1920, assetBase: './', sceneBase: './' });
const shapeCache = new Map();   // input key → Promise<shape>
function shapeFor(input) {
  const key = JSON.stringify(input);
  if (!shapeCache.has(key)) {
    const p = (async () => {
      let sh;
      if (input.baked) sh = await loadBaked('./' + input.baked.replace(/\/?$/, '/'), { fade: true });
      else if (input.svg) sh = await svgToShape(input.svg.trim().startsWith('<') ? input.svg : await (await fetch(input.svg)).text(), input);
      else if (input.png) sh = await bitmapToShape(input.png, input);
      else sh = await textToShape(input.text, input.font, './vendor/harfbuzz/', input);
      sh.toJSON = () => 'shape:' + key.length + ':' + key.slice(0, 64);   // the engine keys inputs by JSON — keep that cheap
      return sh;
    })();
    p.catch(() => shapeCache.delete(key));
    shapeCache.set(key, p);
  }
  return shapeCache.get(key);
}
// geometry = everything that needs eng.load (tracing, sampling, fitting, morph pairing, the backdrop); the rest is applied in place
const geoKey = (spec) => JSON.stringify([spec.width, spec.height, spec.strokes, spec.dots, spec.backdrop, spec.shots.map((s) => [JSON.stringify(s.input).length, JSON.stringify(s.input).slice(0, 200), s.fit, s.in?.type === 'morph'])]);
let loadedKey = null, info = null, syncing = null, again = false, lastLoadMs = 0, lastFastMs = 0, lastWarn = '';
const perf = { loads: [], fast: [] };

function sync() {   // coalesces: one sync at a time, the latest doc wins
  if (syncing) { again = true; return syncing; }
  syncing = (async () => {
    do { again = false; await syncOnce(); } while (again);
    syncing = null;
  })();
  return syncing;
}
async function syncOnce() {
  let built;
  try { built = buildSpec(); } catch (e) { status(e.message, true); return; }
  const { spec, warn } = built, key = geoKey(spec);
  try {
    if (key === loadedKey) {   // look / fx / timing / transitions: re-normalise and swap into the live spec — no re-load, still a pure function of t
      const t0 = performance.now(); const n = normalize(spec);
      Object.assign(eng.spec, n); lastFastMs = performance.now() - t0; perf.fast.push(lastFastMs);
    } else {
      status('tracing shapes…');
      const shapes = await Promise.all(spec.shots.map((s) => shapeFor(s.input)));
      if (again) return;   // a newer edit is waiting: skip the stale load
      const t0 = performance.now();
      info = await eng.load({ ...spec, shots: spec.shots.map((s, k) => ({ ...s, input: { shape: shapes[k] } })) });
      lastLoadMs = performance.now() - t0; perf.loads.push(lastLoadMs); loadedKey = key;
      layout();
      status(`loaded in ${Math.round(lastLoadMs)} ms · ${spec.shots.length} shots · ${spec.strokes} lines`);
    }
    info = { ...info, duration: eng.spec.duration, frames: eng.spec.frames };
    lastWarn = warn.join(' · '); if (lastWarn) status(lastWarn);
    T.t = Math.min(T.t, info.duration - 1e-6); dirty = true; refreshTimeline();
  } catch (e) { status(String(e.message || e), true); }
}

// ---------------------------------------------------------------- layout (preview = the export frame scaled down, same exact aspect)
let PW = 0, PH = 0, exporting = false;
function layout() {
  if (exporting) return;
  const [fw, fh, rw, rh] = FRAMES[D.frame], tb = $('transport').offsetHeight;
  const k = Math.max(1, Math.floor(Math.min(innerWidth / rw, (innerHeight - tb) / rh))), cw = k * rw, ch = k * rh;
  const pk = Math.max(1, Math.min(Math.floor(k * Math.min(devicePixelRatio || 1, 2)), fw / rw));
  PW = pk * rw; PH = pk * rh;

  await enc.flush(); if (err) throw err; muxer.finalize(); enc.close();
  return { blob: new Blob([muxer.target.buffer], { type: 'video/mp4' }), name: `line-studio-${D.frame.replace(':', 'x')}-${W}x${H}.mp4`, frames: N };
}

// Chrome's WebCodecs refuses alpha: 'keep' (NotSupportedError), so alpha is encoded the way libvpx does it: a second VP9
// stream whose luma IS the alpha plane, muxed as each block's BlockAdditional (BlockAddID 1). ffmpeg/Chrome/Safari decode it as yuva420p.
async function encodeWebM(W, H, FPS, N) {
  let codec = null;
  for (const c of ['vp09.00.40.08', 'vp09.00.31.08', 'vp09.00.10.08']) if ((await VideoEncoder.isConfigSupported({ codec: c, width: W, height: H, bitrate: 8e6 })).supported) { codec = c; break; }
  if (!codec) throw new Error(`no VP9 encoder for ${W}x${H}`);
  const { Muxer, ArrayBufferTarget } = await import('./vendor/webm-muxer/webm-muxer.mjs');
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'V_VP9', width: W, height: H, frameRate: FPS, alpha: true } });
  const px = (W * H) / (1080 * 1920), cq = [], aq = [];
  let err = null;
  const pump = () => { while (cq.length && aq.length) { const [c, m] = cq.shift(), a = aq.shift(); const d = new Uint8Array(a.byteLength); a.copyTo(d); muxer.addVideoChunk(c, { ...(m || {}), alphaSideData: d }); } };
  const ce = new VideoEncoder({ output: (c, m) => { cq.push([c, m]); pump(); }, error: (e) => (err = e) });
  const ae = new VideoEncoder({ output: (c) => { aq.push(c); pump(); }, error: (e) => (err = e) });
  ce.configure({ codec, width: W, height: H, bitrate: Math.round(14e6 * px), framerate: FPS });
  ae.configure({ codec, width: W, height: H, bitrate: Math.round(5e6 * px), framerate: FPS });
  const rgba = new Uint8Array(W * H * 4), yuv = new Uint8Array(W * H * 3 / 2), rowB = W * 4; yuv.fill(128, W * H);
  for (let i = 0; i < N; i++) {
    if (err) throw err;
    eng.renderTime(i / FPS);
    const { w, h, buf } = eng.readPixels();   // straight RGBA, bottom-up
    if (w !== W || h !== H) throw new Error(`drawing buffer ${w}x${h} ≠ ${W}x${H}`);
    for (let y = 0; y < H; y++) rgba.set(buf.subarray((H - 1 - y) * rowB, (H - y) * rowB), y * rowB);
    for (let j = 0, n = W * H; j < n; j++) yuv[j] = rgba[j * 4 + 3];
    const ts = Math.round(i * 1e6 / FPS), key = i % (FPS * 2) === 0;
    const cf = new VideoFrame(rgba, { format: 'RGBA', codedWidth: W, codedHeight: H, timestamp: ts, duration: Math.round(1e6 / FPS) }); ce.encode(cf, { keyFrame: key }); cf.close();
    const af = new VideoFrame(yuv, { format: 'I420', codedWidth: W, codedHeight: H, timestamp: ts, duration: Math.round(1e6 / FPS) }); ae.encode(af, { keyFrame: key }); af.close();
    await drain(ce); await drain(ae); await progress(i, N, 'WebM');
  }
  await ce.flush(); await ae.flush(); pump(); if (err) throw err;
  if (cq.length || aq.length) throw new Error(`colour/alpha streams out of step (${cq.length}/${aq.length} left)`);
  muxer.finalize(); ce.close(); ae.close();
  return { blob: new Blob([muxer.target.buffer], { type: 'video/webm' }), name: `line-studio-${D.frame.replace(':', 'x')}-${W}x${H}-alpha.webm`, frames: N };
}
$('mp4').onclick = () => exportVideo('mp4');
$('webm').onclick = () => exportVideo('webm');
$('save').onclick = async () => {
  if (exporting) return;
  try {
    const t = T.t;
    const blob = await withExportSize(1, false, async () => { eng.renderTime(t); return new Promise((r) => canvas.toBlob(r, 'image/png')); });
    download(blob, `line-studio-${t.toFixed(2)}s${D.transparent ? '-alpha' : ''}.png`); $('recstat').textContent = `saved PNG at ${t.toFixed(2)} s`;
  } catch (e) { $('recstat').textContent = 'PNG failed: ' + (e.message || e); }
};
// scene.json: the same scene, for `node render.mjs` (dropped files travel inside it as data: URLs)
function sceneJson() { const { spec } = buildSpec({ forJson: true }); return JSON.stringify(spec, null, 1); }
$('dlJson').onclick = () => { try { download(new Blob([sceneJson()], { type: 'application/json' }), 'scene.json'); } catch (e) { status(e.message, true); } };
$('copyJson').onclick = async () => {
  try { const txt = sceneJson();
    try { await navigator.clipboard.writeText(txt); } catch { const ta = h('textarea', { value: txt }); document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    $('copyJson').textContent = 'Copied ✓'; setTimeout(() => ($('copyJson').textContent = 'Copy scene.json'), 1500);
  } catch (e) { status(e.message, true); }
};
const paintCmd = () => { $('cmd').textContent = 'node render.mjs studio/scene.json --alpha --out x.mov'; };

// ---------------------------------------------------------------- keys
addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hide');
  else if (e.key === ' ') { e.preventDefault(); play(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); play(false); seek(T.t + (e.key === 'ArrowRight' ? 1 : -1) / fps()); }
});

// ---------------------------------------------------------------- go
paintLook(); paintCmd(); renderShots(); play(T.playing);
await sync();
if (Q.has('t')) seek(+Q.get('t'), false);
requestAnimationFrame(frame);
// hooks for tests and for Claude driving the page
window.studio = { eng, D, get info() { return info; }, get T() { return T; }, seek, play, sync, buildSpec, sceneJson, perf, importScene, useFile,
  idle: async () => { while (syncing) await syncing; await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))); }, renderShots, pick };
window.__ready = true;
