<!doctype html>
<html><head><meta charset="utf-8"><title>LineField player</title><link rel="icon" href="data:,">
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js" } }</script>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Headless player for render.mjs: ?scene=<url of scene.json>[&alpha=1]. Exposes window.LF.
import { createEngine } from './engine/linefield.mjs';
const Q = new URLSearchParams(location.search), url = Q.get('scene');
try {
  const spec = await (await fetch(url)).json();
  if (Q.get('alpha') === '1') spec.background = 'transparent';
  for (const k of ['width', 'height', 'fps']) if (Q.get(k)) spec[k] = +Q.get(k);
  const canvas = document.getElementById('c');
  const eng = await createEngine({ canvas, width: spec.width || 1080, height: spec.height || 1920, assetBase: './', sceneBase: url.replace(/[^/]*$/, '') });
  const info = await eng.load(spec);
  const b64 = (u8) => { let s = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); };
  window.LF = {
    info, eng,
    frame(n) { eng.renderFrame(n); const { buf } = eng.readPixels(); return b64(buf); },
    still(n) { eng.renderFrame(n); return canvas.toDataURL('image/png'); },
  };
  window.__ready = true;
} catch (e) { console.error(e); window.__error = String(e && e.stack || e); }
</script></body></html>
